version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: interviewx_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: interviewx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviewx_network

  backend:
    build: ./backend
    container_name: interviewx_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/interviewx
    depends_on:
      - db
    networks:
      - interviewx_network

  frontend:
    build: ./frontend
    container_name: interviewx_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - interviewx_network

networks:
  interviewx_network:
    driver: bridge

volumes:
  postgres_data: